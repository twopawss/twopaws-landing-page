<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwoPaws</title>

    <!-- Route-level SEO is injected by React Helmet and SSG scripts. -->

    <!-- App / Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logotrans.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-32x32.png" />
    <meta name="application-name" content="TwoPaws" />
    <meta name="theme-color" content="#FEC329" />
    <!-- iOS Smart App Banner on every page; product pages add an app-argument that opens the product. -->
    <meta name="apple-itunes-app" content="app-id=6745481497" />

    <!-- Inter is self-hosted (see src/index.css); preload it for first paint. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Outfit (headings) still comes from Google Fonts; self-host it alongside Inter when convenient. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
