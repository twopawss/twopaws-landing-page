<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwoPaws</title>

    <!-- Route-level SEO is injected by React Helmet and SSG scripts. -->

    <!-- App / Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logotrans.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-32x32.png" />
    <meta name="application-name" content="TwoPaws" />
    <meta name="theme-color" content="#FEC329" />

    <!-- Fonts are self-hosted (see src/index.css); preload the two the first paint needs. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/marvin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Landing hero image (the LCP element). -->
    <link
      rel="preload"
      as="image"
      href="/hero-dog-916.webp"
      imagesrcset="/hero-dog-460.webp 460w, /hero-dog-916.webp 916w"
      imagesizes="(min-width: 1024px) 364px, 60vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
