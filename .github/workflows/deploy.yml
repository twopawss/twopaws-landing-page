name: Deploy

# Every push to main is checked and, if the build and dist check pass, deployed
# to https://twopaws.pet (the default Firebase Hosting site of pets-13gvj0).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The same values as client/.env on the machine that used to deploy by hand.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
      VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
      # Build constant: without "catalogue" the shop pages fall back to the legacy
      # products collection (client/src/lib/shopBackend.ts).
      VITE_SHOP_BACKEND: ${{ vars.VITE_SHOP_BACKEND }}
      SSG_STRICT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the build settings are present
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_STORAGE_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; exit 1; fi
          done
          if [ "$VITE_SHOP_BACKEND" != "catalogue" ]; then
            echo "::error::Repository variable VITE_SHOP_BACKEND must be 'catalogue'; a build without it deploys the legacy shop"; exit 1
          fi

      - name: Install
        run: npm ci

      # react-snap 1.23 pins puppeteer 1.x, whose bundled Chromium needs
      # libraries ubuntu-latest no longer ships by default.
      - name: Install Chromium libraries for react-snap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 \
            libgbm1 libgtk-3-0 libnss3 libxcomposite1 libxdamage1 libxfixes3 \
            libxkbcommon0 libxrandr2 libxss1 libxtst6 fonts-liberation

      - name: Typecheck
        run: npm run check

      # firebase.json's predeploy hook runs `npm run build` (vite, SSG, react-snap,
      # sitemap, feed, dist check) and the deploy stops if any step fails.
      - name: Build and deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --project pets-13gvj0 --only hosting --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
